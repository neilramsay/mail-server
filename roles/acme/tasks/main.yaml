# Heavily inspired by https://github.com/nephelaiio/ansible-role-acme-certificate-route53

- name: Install dependencies
  become: true
  block:
    - name: Install package requirements
      ansible.builtin.package:
        name:
          - openssl
          - certbot

    - name: Install pip requirements
      ansible.builtin.pip:
        name:
          - dnspython
          - cryptography
          - boto3
      changed_when: false

- name: Check AWS credentials
  amazon.aws.aws_caller_info:
    aws_access_key_id: "{{ aws_access_key_id }}"
    aws_secret_access_key: "{{ aws_secret_access_key }}"
    aws_session_token: "{{ aws_session_token }}"

- name: Automatic Certificate Management Environment (ACME) Setup
  become: true
  block:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ acme_dir }}/{{ item }}"
        owner: root
        group: root
        mode: u=rwx,g=rwx,o=rx
        state: directory
      with_items:
        - accounts # ACME registrations
        - archive  # All certs/chains/fullchains/privkeys
        - csr      #
        - keys     # ?
        - live     # Symlinks to certs+keys
        - renewal  #

    - name: Generate Account Key
      community.crypto.openssl_privatekey:
        path: "{{ acme_account_key }}"
        type: "{{ acme_key_type }}"

    - name: Register Account
      community.crypto.acme_account:
        acme_version: "{{ acme_version }}"
        acme_directory: "{{ acme_server_api }}"
        account_key_src: "{{ acme_account_key }}"
        state: present
        terms_agreed: true
        contact:
          - "mailto:{{ acme_email }}"

- name: Generate CSR
  become: true
  block:
    - name: Generate Private Key
      community.crypto.openssl_privatekey:
        path: "{{ acme_keys_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.key"

    - name: Generate CSR
      community.crypto.openssl_csr:
        path: "{{ acme_csrs_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.csr"
        privatekey_path: "{{ acme_keys_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.key"
        common_name: "{{ acme_hostname }}.{{ acme_dns_zone }}"
        subject_alt_name:
          - "DNS:{{ acme_hostname }}.{{ acme_dns_zone }}"

- name: DNS Challenge
  become: true
  block:
    - name: Create ACME Challenge
      community.crypto.acme_certificate:
        acme_version: "{{ acme_version }}"
        acme_directory: "{{ acme_server_api }}"
        account_key_src: "{{ acme_account_key }}"
        challenge: "{{ acme_challenge_type }}"
        profile: tlsserver
        force: true # FORCE FORCE FORCE
        csr: "{{ acme_csrs_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.csr"
        dest: "{{ acme_certs_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.crt"
        fullchain_dest: "{{ acme_certs_dir }}/fullchain_{{ acme_hostname }}.{{ acme_dns_zone }}.crt"
        remaining_days: 91
      register: acme_certificate_challenge

    - name: Debug
      ansible.builtin.debug:
        var: acme_certificate_challenge.challenge_data

    - name: Create Route53 Validation
      vars:
        full_hostname: "{{ acme_hostname }}.{{ acme_dns_zone }}"
      amazon.aws.route53:
        aws_access_key_id: "{{ aws_access_key_id }}"
        aws_secret_access_key: "{{ aws_secret_access_key }}"
        aws_session_token: "{{ aws_session_token }}"
        state: present
        type: TXT
        zone: "{{ acme_dns_zone }}"
        record: "{{ acme_certificate_challenge.challenge_data[full_hostname]['dns-01']['record'] }}" # Generated
        value: '"{{ acme_certificate_challenge.challenge_data[full_hostname]["dns-01"]["resource_value"] }}"' # Generated
        wait: true

    - name: Validate ACME Challenge
      community.crypto.acme_certificate:
        acme_version: "{{ acme_version }}"
        acme_directory: "{{ acme_server_api }}"
        account_key_src: "{{ acme_account_key }}"
        challenge: "{{ acme_challenge_type }}"
        data: "{{ acme_certificate_challenge }}"
        profile: tlsserver
        force: true # FORCE FORCE FORCE
        csr: "{{ acme_csrs_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.csr"
        dest: "{{ acme_certs_dir }}/{{ acme_hostname }}.{{ acme_dns_zone }}.crt"
        fullchain_dest: "{{ acme_certs_dir }}/fullchain_{{ acme_hostname }}.{{ acme_dns_zone }}.crt"

  always:
    - name: Cleanup Route53 Challenge
      vars:
        full_hostname: "{{ acme_hostname }}.{{ acme_dns_zone }}"
      amazon.aws.route53:
        aws_access_key_id: "{{ aws_access_key_id }}"
        aws_secret_access_key: "{{ aws_secret_access_key }}"
        aws_session_token: "{{ aws_session_token }}"
        state: absent
        type: TXT
        zone: "{{ acme_dns_zone }}"
        record: '{{ acme_certificate_challenge.challenge_data[full_hostname]["dns-01"]["record"] }}' # Generated
        wait: true
